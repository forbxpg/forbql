[project]
name = "forbql"
version = "0.0.0"
description = "The SQL firewall for AI agents: read-only execution, allowlists, PII masking and a tamper-evident audit log for SQLite, PostgreSQL and MySQL."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "forbxpg" }]
requires-python = ">=3.12"
keywords = ["sql", "firewall", "ai-agents", "mcp", "text-to-sql", "security", "postgresql", "mysql", "sqlite"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "pyyaml>=6.0.3,<7",
    "sqlglot>=30.19,<31",
    "typer>=0.27,<0.28",
]

[project.urls]
Repository = "https://github.com/forbxpg/forbql"
Issues = "https://github.com/forbxpg/forbql/issues"

[project.scripts]
forbql = "forbql.cli:app"

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.31,<0.32",
]
mysql = [
    "pymysql[rsa]>=1.2,<2",
]
all = [
    "forbql[mysql,postgres,store]",
]
store = [
    "alembic>=1.20,<2",
    "asyncpg>=0.31,<0.32",
    "cryptography>=50,<51",
    "sqlalchemy[asyncio]>=2.1,<2.2",
]

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.31,<0.32",
    "basedpyright>=1.40,<2",
    "faker>=40.39,<41",
    "forbql[all]",
    "import-linter>=2.15,<3",
    "pre-commit>=4.6,<5",
    "psycopg[binary]>=3.3,<4",
    "pymysql>=1.2,<2",
    "pytest>=9.1,<10",
    "pytest-cov>=7.1,<8",
    "ruff>=0.16.8,<0.17",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
# importlib: test modules are named by their path, so two test packages may share a
# name (tests/unit/engines, tests/integration/engines).
addopts = [
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "-ra",
    "-m",
    "not integration",
]
markers = [
    "integration: needs the local stand: docker compose -f deploy/compose.yaml up -d --wait",
]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["forbql"]

[tool.importlinter]
root_package = "forbql"

[[tool.importlinter.contracts]]
name = "The CLI reaches user databases only through session"
type = "forbidden"
source_modules = ["forbql.cli"]
forbidden_modules = ["forbql.engines"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Layers: upper layers may import lower ones, never the reverse"
type = "layers"
layers = [
    "(forbql.cli) | (forbql.mcp)",
    "(forbql.session)",
    "(forbql.knowledge)",
    "(forbql.access)",
    "(forbql.store)",
    "(forbql.audit)",
    "(forbql.engines)",
    "(forbql.masking)",
    "(forbql.firewall)",
    "(forbql.policy)",
]

[tool.uv.sources]
forbql = { workspace = true }

